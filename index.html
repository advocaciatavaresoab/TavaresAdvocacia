<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavares Advocacia · Gestão</title>
    
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- ==================== TODOS OS ESTILOS ==================== -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/painel.css">
    <link rel="stylesheet" href="css/clientes.css">
    <link rel="stylesheet" href="css/processos.css">
    <link rel="stylesheet" href="css/pericias.css">
    <link rel="stylesheet" href="css/parceiros.css">
    <link rel="stylesheet" href="css/agenda.css">
    <link rel="stylesheet" href="css/atividades.css">
    <link rel="stylesheet" href="css/documentos.css">
    <link rel="stylesheet" href="css/financeiro.css">
    <link rel="stylesheet" href="css/relatorios.css">
    <link rel="stylesheet" href="css/configuracoes.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="app-container">
        
        <!-- ==================== SIDEBAR ==================== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <img class="imgPainHeader" src="../assets/img/logo_tavares.png" alt="Logo Tavares Advocacia" >
                </div>
                <button class="close-sidebar" id="closeSidebar" aria-label="Fechar menu">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <nav class="sidebar-nav" aria-label="Navegação principal">
                <ul>
                    <li><a href="#" data-page="painel"><i class="fa-solid fa-layer-group"></i><span>Painel</span></a></li>
                    <li><a href="#" data-page="processos"><i class="fas fa-gavel"></i><span>Processos</span><span class="badge" id="badgeProcessos">0</span></a></li>
                    <li><a href="#" data-page="clientes"><i class="fas fa-users"></i><span>Clientes</span></a></li>
                    <li><a href="#" data-page="parceiros"><i class="fa-solid fa-handshake"></i><span>Parceiros</span></a></li>
                    <li><a href="#" data-page="agenda"><i class="fas fa-calendar-alt"></i><span>Agenda</span></a></li>
                    <li><a href="#" data-page="atividades"><i class="fas fa-tasks"></i><span>Atividades</span></a></li>
                    <li><a href="#" data-page="pericias"><i class="fas fa-stethoscope"></i><span>Perícias</span></a></li>
                    <li><a href="#" data-page="documentos"><i class="fas fa-folder-open"></i><span>Documentos</span></a></li>
                    <li><a href="#" data-page="financeiro"><i class="fas fa-sack-dollar"></i><span>Financeiro</span></a></li>
                    <li><a href="#" data-page="relatorios"><i class="fas fa-file-lines"></i><span>Relatórios</span></a></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar"><i class="fas fa-scale-balanced"></i></div>
                    <div class="user-details">
                        <p class="user-name" id="sidebarUserName">Tavares Advocacia</p>
                        <p class="user-role" id="sidebarUserRole">Escritório</p>
                    </div>
                </div>
                <button class="btn-logout btn-icon" onclick="auth.logout()" title="Sair">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- ==================== MAIN ==================== -->
        <main class="main-content">
            <header class="topbar">
                <button class="btn-menu" id="openSidebar" aria-label="Abrir menu">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input class="busca" type="text" id="buscaGlobal" placeholder="Buscar em todo o sistema...">
                </div>
                <div class="topbar-actions">
                    <button class="btn-icon" title="Notificações" onclick="abrirPainelNotificacoes()" style="position: relative;">
                        <i class="fas fa-bell" style="font-size: 1.2rem;"></i>
                        <span class="notification-dot" style="display: none; position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: white; font-size: 0.6rem; font-weight: 700; font-family: var(--font-mono); border: 2px solid white; padding: 0 4px; align-items: center; justify-content: center;">0</span>
                    </button>
                    
                    <a href="#" data-page="configuracoes" class="btn-icon" title="Configurações"><i class="fas fa-cog"></i></a>

                </div>
            </header>

            <div class="page-content" id="pageContent">
                <!-- Conteúdo carregado dinamicamente -->
            </div>
                <!-- ==================== RODAPÉ ==================== -->
            <footer class="footer">
                <div class="footer-content">
                    <span>© 2026 Tavares Advocacia</span>
                    <span>|</span>
                    <span>GestãoPro v1.0</span>
                    <span>|</span>
                    <span>Desenvolvido por <i class="fas " style="color: var(--danger);">LZ</i></span>
                </div>
            </footer>
        </main>
    </div>

    <div class="overlay" id="overlay"></div>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="/js/api.js"></script>
    <script src="/js/cache.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/busca.js"></script>
    <script src="/js/modulos/login.js"></script>
    <script src="/js/modulos/notificacoes.js"></script>
    <script src="/js/modulos/painel.js"></script>
    <script src="/js/modulos/clientes.js"></script>
    <script src="/js/modulos/processos.js"></script>
    <script src="/js/modulos/pericias.js"></script>
    <script src="/js/modulos/parceiros.js"></script>
    <script src="/js/modulos/agenda.js"></script>
    <script src="/js/modulos/atividades.js"></script>
    <script src="/js/modulos/documentos.js"></script>
    <script src="/js/modulos/financeiro.js"></script>
    <script src="/js/modulos/relatorios.js"></script>
    <script src="/js/modulos/configuracoes.js"></script> 
    <script src="/js/app.js"></script>
</body>
</html>
