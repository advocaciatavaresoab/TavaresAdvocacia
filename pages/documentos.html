<!-- ==================== DOCUMENTOS ==================== -->
<div class="page-header">
    <p class="eyebrow">Módulo</p>
    <h1>Documentos</h1>
    <div class="page-actions">
        <button class="btn-primary" id="btnNovaPasta" style="background: var(--gold-600);">
            <i class="fas fa-folder-plus"></i> Nova pasta
        </button>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="buscaDocumento" placeholder="Buscar pastas...">
        </div>
    </div>
</div>

<!-- Cards de estatísticas -->
<div class="stats-grid-mini">
    <div class="stat-card-mini">
        <i class="fas fa-folder"></i>
        <div><h4>Total</h4><span id="totalPastas">0</span></div>
    </div>
    <div class="stat-card-mini">
        <i class="fas fa-folder-open"></i>
        <div><h4>Processos</h4><span id="totalPastasProcessos">0</span></div>
    </div>
    <div class="stat-card-mini">
        <i class="fas fa-folder-plus"></i>
        <div><h4>Organizacionais</h4><span id="totalPastasOrganizacionais">0</span></div>
    </div>
    <div class="stat-card-mini">
        <i class="fas fa-external-link-alt"></i>
        <div><h4>Abrir no Drive</h4><span id="totalLinks">0</span></div>
    </div>
</div>

<!-- ========== PASTAS (GRID HORIZONTAL) ========== -->
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-folder-tree"></i> Pastas do Google Drive</h2>
        <span class="text-muted" id="contagemPastas">0 pastas</span>
    </div>
    <div class="card-body">
        <div class="pastas-grid" id="pastasGrid">
            <div class="pasta-card pasta-add" onclick="abrirModalPasta()">
                <i class="fas fa-folder-plus"></i>
                <span>Nova pasta</span>
            </div>
        </div>
    </div>
</div>

<!-- Modal Nova Pasta -->
<div class="modal-overlay" id="modalPasta">
    <div class="modal" style="max-width: 450px;">
        <div class="modal-header">
            <h2>Nova Pasta</h2>
            <button class="modal-close" id="fecharModalPasta">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="formPasta">
                <div class="form-group">
                    <label>Nome da pasta *</label>
                    <input type="text" id="pastaNome" required placeholder="Ex: Petições, Contratos...">
                </div>
                <div class="form-group">
                    <label>Cor</label>
                    <div class="cores-pasta">
                        <span class="cor-pasta selected" data-cor="#3568c9" style="background: #3568c9;" onclick="selecionarCorPasta(this)"></span>
                        <span class="cor-pasta" data-cor="#2f9e5b" style="background: #2f9e5b;" onclick="selecionarCorPasta(this)"></span>
                        <span class="cor-pasta" data-cor="#c94b3f" style="background: #c94b3f;" onclick="selecionarCorPasta(this)"></span>
                        <span class="cor-pasta" data-cor="#c98a1f" style="background: #c98a1f;" onclick="selecionarCorPasta(this)"></span>
                        <span class="cor-pasta" data-cor="#8b5cf6" style="background: #8b5cf6;" onclick="selecionarCorPasta(this)"></span>
                        <span class="cor-pasta" data-cor="#ec4899" style="background: #ec4899;" onclick="selecionarCorPasta(this)"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Link da pasta no Drive</label>
                    <input type="text" id="pastaLink" placeholder="https://drive.google.com/drive/folders/...">
                    <small style="color: var(--text-muted); font-size: 0.75rem;">Cole o link da pasta no Google Drive</small>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-cancelar" id="cancelarPasta">Cancelar</button>
            <button class="btn-salvar" id="salvarPasta">
                <i class="fas fa-check"></i> Criar
            </button>
        </div>
    </div>
</div>
